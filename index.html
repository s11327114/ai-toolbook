<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Toolbook | 個人 AI 工具實戰手冊</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-bold text-xl text-indigo-600 tracking-tight">
        <span class="bg-indigo-600 text-white px-2 py-0.5 rounded-md text-sm">AI</span>
        <span>Toolbook</span>
      </a>
      <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">
        規範驅動知識庫
      </span>
    </div>
  </header>

  <!-- 主要內容區 -->
  <div class="max-w-4xl mx-auto px-6 py-10 flex-1 w-full">
    
    <!-- 標頭介紹 -->
    <section class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900 mb-3">個人 AI 工具實戰手冊</h1>
      <p class="text-slate-600 leading-relaxed">
        精選日常工作與開發中最高效的 AI 工具，整理核心定位、適用場景與可直接複製的實戰 Prompt 模板。
      </p>
    </section>

    <!-- 分類篩選按鈕 -->
    <div class="flex flex-wrap gap-2 mb-8" id="filter-bar">
      <button data-filter="all" class="filter-btn bg-indigo-600 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
        全部工具
      </button>
      <button data-filter="程式開發" class="filter-btn bg-white text-slate-600 border border-slate-200 hover:border-indigo-300 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
        程式開發
      </button>
      <button data-filter="效率工具" class="filter-btn bg-white text-slate-600 border border-slate-200 hover:border-indigo-300 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
        效率工具
      </button>
      <button data-filter="寫作輔助" class="filter-btn bg-white text-slate-600 border border-slate-200 hover:border-indigo-300 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
        寫作輔助
      </button>
      <button data-filter="圖像生成" class="filter-btn bg-white text-slate-600 border border-slate-200 hover:border-indigo-300 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
        圖像生成
      </button>
    </div>

    <!-- 工具卡片列表 (AI 新增工具時請更新此區塊) -->
    <main id="tool-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- 卡片 1: Perplexity AI -->
      <a href="tools/perplexity.html" data-category="效率工具" class="tool-card group block bg-white border border-slate-200 rounded-xl p-6 hover:border-indigo-400 hover:shadow-sm transition">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
            效率工具
          </span>
          <span class="text-slate-400 group-hover:text-indigo-600 transition text-sm">查看筆記 →</span>
        </div>
        <h2 class="text-xl font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition">Perplexity AI</h2>
        <p class="text-slate-600 text-sm leading-relaxed">
          結合即時網路搜尋與大語言模型的對話式研究引擎，每個回答皆附帶可驗證的來源引用連結。
        </p>
      </a>

      <!-- 卡片 2: Cursor -->
      <a href="tools/cursor.html" data-category="程式開發" class="tool-card group block bg-white border border-slate-200 rounded-xl p-6 hover:border-indigo-400 hover:shadow-sm transition">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
            程式開發
          </span>
          <span class="text-slate-400 group-hover:text-indigo-600 transition text-sm">查看筆記 →</span>
        </div>
        <h2 class="text-xl font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition">Cursor</h2>
        <p class="text-slate-600 text-sm leading-relaxed">
          原生整合 AI 的程式碼編輯器，支援全專案上下文理解、多檔案同步編輯與自然語言重構。
        </p>
      </a>

    </main>
  </div>

  <!-- 頁尾 -->
  <footer class="border-t border-slate-200 bg-white mt-12">
    <div class="max-w-4xl mx-auto px-6 py-6 text-center text-sm text-slate-500">
      Built with AGENTS.md Specification · Pure HTML &amp; Tailwind CSS
    </div>
  </footer>

  <!-- 分類篩選互動腳本 -->
  <script>
    const buttons = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.tool-card');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.getAttribute('data-filter');

        // 更新按鈕樣式
        buttons.forEach(b => {
          b.classList.remove('bg-indigo-600', 'text-white');
          b.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
        });
        btn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
        btn.classList.add('bg-indigo-600', 'text-white');

        // 篩選卡片
        cards.forEach(card => {
          const category = card.getAttribute('data-category');
          if (filter === 'all' || category === filter) {
            card.style.display = 'block';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
